<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Pato Impossível</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #17251d; font-family: system-ui, Arial, sans-serif; overscroll-behavior: none; touch-action: none; }
  #game { position: relative; width: 100vw; height: 100dvh; min-height: 420px; overflow: hidden; cursor: crosshair; user-select: none; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; color: #fff; z-index: 2; }
  .panel { background: #101a18d9; border: 1px solid #ffffff35; border-radius: 12px; padding: 9px 14px; box-shadow: 0 5px 18px #0003; text-align: center; min-width: 105px; }
  .panel small { display: block; font-size: 10px; letter-spacing: 1.5px; color: #b9c9bd; text-transform: uppercase; }
  .panel strong { font-size: 20px; }
  #message { position: absolute; top: 95px; left: 50%; transform: translateX(-50%); width: min(90%, 500px); text-align: center; color: white; text-shadow: 0 2px 5px #000; font-weight: 700; font-size: clamp(14px, 2vw, 19px); pointer-events: none; }
  #hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 92%; color: #fff; background: #101a18d9; border: 1px solid #ffffff35; border-radius: 10px; padding: 9px 14px; font-size: 12px; text-align: center; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; background: #08130db0; z-index: 5; }
  .modal { width: min(90%, 430px); padding: 28px; border-radius: 18px; background: #17251ff2; color: white; text-align: center; border: 1px solid #ffffff35; box-shadow: 0 20px 70px #0008; }
  .modal h1 { margin: 0 0 8px; font-size: 30px; }
  .modal p { color: #d0ddd3; line-height: 1.5; }
  button { border: 0; border-radius: 10px; background: #e4b84e; color: #241c0b; font-weight: 800; padding: 13px 24px; font-size: 15px; cursor: pointer; }
  button:hover { background: #f2ca67; transform: translateY(-1px); }
  @media (max-width: 600px) {
    .hud { top: max(8px, env(safe-area-inset-top)); gap: 5px; }
    .panel { min-width: 76px; padding: 6px 7px; border-radius: 9px; }
    .panel small { font-size: 9px; letter-spacing: 1px; }
    .panel strong { font-size: 16px; }
    #message { top: 72px; width: 94%; font-size: 14px; }
    #hint { bottom: max(10px, env(safe-area-inset-bottom)); font-size: 11px; padding: 8px 10px; }
    .modal { padding: 23px 18px; }
    .modal h1 { font-size: 26px; }
    button { min-height: 48px; }
  }
  @media (max-height: 560px) and (orientation: landscape) {
    .hud { top: 5px; }
    .panel { padding: 4px 7px; }
    #message { top: 58px; }
    #hint { bottom: 5px; }
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="scene"></canvas>
  <div class="hud">
    <div class="panel"><small>Disparos</small><strong id="shots">0</strong></div>
    <div class="panel"><small>Acertos</small><strong id="hits">0</strong></div>
    <div class="panel"><small>Precisão real</small><strong>0,01%</strong></div>
  </div>
  <div id="message">O pato está ali. Parece fácil.</div>
  <div id="hint">TOQUE na tela para mirar e atirar · computador: MOUSE ou ESPAÇO</div>
  <div id="start">
    <div class="modal">
      <h1>O Pato Impossível</h1>
      <p>Um pato. Uma fazenda. Uma arma.<br>Você tem <b>0,01% de chance</b> de acertar cada disparo.<br>O pato não está preocupado.</p>
      <button id="play">COMEÇAR</button>
    </div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const game = document.getElementById('game');
  const shotsEl = document.getElementById('shots');
  const hitsEl = document.getElementById('hits');
  const message = document.getElementById('message');
  const start = document.getElementById('start');

  let w, h, dpr, shots = 0, hits = 0, running = false;
  let mouse = { x: 0, y: 0 };
  let duck = { x: 0, y: 0, dir: 1, speed: 0.65, bob: 0, pause: 0, fear: 0, jump: 0, jumpV: 0, dodgeCooldown: 0, quackBubble: 0, quackNext: 2.5 };
  let bullets = [], particles = [], last = 0, elapsed = 0, quackTimer = 0;
  const chance = 0.0001; // 0,01% por disparo

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = game.clientWidth; h = game.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    duck.y = h * 0.64;
    if (!duck.x) duck.x = w * 0.68;
    draw();
  }
  window.addEventListener('resize', resize);

  function ellipse(x,y,rx,ry,color) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill();
  }
  function drawCloud(x,y,s) {
    ellipse(x,y,24*s,13*s,'#ffffffb8'); ellipse(x+20*s,y-7*s,20*s,16*s,'#ffffffc9'); ellipse(x+39*s,y,25*s,12*s,'#ffffffb8');
  }
  function drawFarm() {
    const sky = ctx.createLinearGradient(0,0,0,h);
    sky.addColorStop(0,'#78c5e8'); sky.addColorStop(.57,'#d5e9c5'); sky.addColorStop(1,'#73934c');
    ctx.fillStyle=sky; ctx.fillRect(0,0,w,h);
    ellipse(w*.82,h*.16,42,42,'#ffe89b');
    drawCloud(w*.18,h*.16,.85); drawCloud(w*.52,h*.11,.62);
    // distant hills
    ctx.fillStyle='#86a96c'; ctx.beginPath(); ctx.moveTo(0,h*.48);
    ctx.quadraticCurveTo(w*.18,h*.30,w*.37,h*.48); ctx.quadraticCurveTo(w*.62,h*.28,w*.82,h*.48); ctx.lineTo(w,h*.55); ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.fill();
    // fields
    ctx.fillStyle='#668d42'; ctx.fillRect(0,h*.53,w,h*.47);
    ctx.fillStyle='#89a94f'; ctx.beginPath(); ctx.moveTo(0,h*.68); ctx.quadraticCurveTo(w*.5,h*.53,w,h*.7); ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.fill();
    // crop rows
    ctx.strokeStyle='#547b37'; ctx.lineWidth=3;
    for(let i=-2;i<9;i++){ ctx.beginPath(); ctx.moveTo(w*.42+i*45,h); ctx.lineTo(w*.54+i*22,h*.68); ctx.stroke(); }
    // barn
    const bx=w*.08, by=h*.37, bw=Math.min(150,w*.18), bh=h*.23;
    ctx.fillStyle='#a94232'; ctx.fillRect(bx,by+bh*.3,bw,bh*.7);
    ctx.fillStyle='#71332b'; ctx.beginPath(); ctx.moveTo(bx-12,by+bh*.32); ctx.lineTo(bx+bw*.5,by); ctx.lineTo(bx+bw+12,by+bh*.32); ctx.fill();
    ctx.fillStyle='#f1d6a8'; ctx.fillRect(bx+bw*.39,by+bh*.52,bw*.23,bh*.48);
    ctx.strokeStyle='#f1d6a8'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(bx+bw*.39,by+bh*.52); ctx.lineTo(bx+bw*.62,by+bh); ctx.moveTo(bx+bw*.62,by+bh*.52); ctx.lineTo(bx+bw*.39,by+bh); ctx.stroke();
    // fence
    ctx.strokeStyle='#e5d2a2'; ctx.lineWidth=6;
    for(let i=0;i<7;i++){let x=w*.53+i*w*.075; ctx.beginPath();ctx.moveTo(x,h*.61);ctx.lineTo(x,h*.77);ctx.stroke();}
    ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(w*.51,h*.65);ctx.lineTo(w,h*.65);ctx.moveTo(w*.51,h*.73);ctx.lineTo(w,h*.73);ctx.stroke();
    // foreground grass blades
    ctx.strokeStyle='#426d32'; ctx.lineWidth=2;
    for(let i=0;i<100;i++){let x=(i*83)%w,y=h*.77+((i*37)%(Math.max(1,h*.22)));ctx.beginPath();ctx.moveTo(x,y+8);ctx.lineTo(x-4,y-5);ctx.stroke();}
  }
  function drawDuck() {
    const x=duck.x, y=duck.y + Math.sin(duck.bob)*3 - duck.jump, s=Math.max(.72,Math.min(1.15,w/900));
    // Expressão de pânico: olhos arregalados e penas arrepiadas.
    if (duck.fear > 0) {
      ctx.save();
      ctx.strokeStyle = '#fff8dc'; ctx.lineWidth = 2.5;
      for (let i=0;i<3;i++) {
        const px=x-22+i*22, py=y-54-Math.sin(duck.bob*2+i)*3;
        ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px-3,py-10); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save(); ctx.translate(x,y); ctx.scale(duck.dir,1);
    // shadow
    ellipse(0,26*s,39*s,7*s,'#263d2580');
    // feet
    ctx.strokeStyle='#d77c25';ctx.lineWidth=4*s;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-8*s,16*s);ctx.lineTo(-11*s,27*s);ctx.lineTo(-19*s,27*s);ctx.moveTo(13*s,16*s);ctx.lineTo(15*s,27*s);ctx.lineTo(23*s,27*s);ctx.stroke();
    // body and wing
    ellipse(0,0,34*s,23*s,'#f4f0d8'); ellipse(-5*s,3*s,19*s,13*s,'#d8d2b6');
    // neck/head
    ctx.strokeStyle='#f4f0d8';ctx.lineWidth=17*s;ctx.beginPath();ctx.moveTo(19*s,-8*s);ctx.quadraticCurveTo(27*s,-28*s,21*s,-33*s);ctx.stroke();
    ellipse(22*s,-34*s,13*s,12*s,'#f4f0d8');
    // beak
    ctx.fillStyle='#e59b2d';ctx.beginPath();ctx.moveTo(31*s,-34*s);ctx.lineTo(47*s,-30*s);ctx.lineTo(31*s,-26*s);ctx.fill();
    // eye, permanently unimpressed
    ellipse(25*s,-37*s,(duck.fear>0?3.2:2.2)*s,(duck.fear>0?4:2.5)*s,'#20251d');
    ctx.strokeStyle='#8e8a78';ctx.lineWidth=1.5*s;ctx.beginPath();ctx.moveTo(21*s,-42*s);ctx.lineTo(29*s,-41*s);ctx.stroke();
    // tiny miserable brow
    ctx.restore();

    // Balão de fala ocasional do pato.
    if (duck.quackBubble > 0) {
      ctx.save();
      const bx = x + 38, by = y - 72 - duck.jump;
      ctx.globalAlpha = Math.min(1, duck.quackBubble * 2.5);
      ctx.fillStyle = '#fffdf2';
      ctx.strokeStyle = '#4b493e';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(bx - 4, by - 19, 91, 29, 9);
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx + 5, by + 9); ctx.lineTo(bx - 2, by + 17); ctx.lineTo(bx + 16, by + 9); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#29291f';
      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Quac, quac!', bx + 41, by);
      ctx.restore();
    }
  }
  function drawShooter() {
    const x=w*.5, y=h*.91;
    // back-facing shooter
    ellipse(x,y+5,31,13,'#18231d');
    ctx.fillStyle='#293c32';ctx.beginPath();ctx.moveTo(x-23,y-34);ctx.lineTo(x+23,y-34);ctx.lineTo(x+30,y+9);ctx.lineTo(x-30,y+9);ctx.fill();
    ellipse(x,y-43,17,18,'#d6a27c');
    // hat
    ctx.fillStyle='#59452d';ctx.beginPath();ctx.ellipse(x,y-54,23,7,0,0,Math.PI*2);ctx.fill();ctx.fillRect(x-14,y-67,28,14);
    // arms and rifle aimed toward mouse
    const dx=mouse.x-x, dy=mouse.y-(y-28), a=Math.atan2(dy,dx);
    ctx.save();ctx.translate(x,y-26);ctx.rotate(a);
    ctx.strokeStyle='#d6a27c';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(24,0);ctx.stroke();
    ctx.fillStyle='#30302b';ctx.fillRect(12,-5,57,8);ctx.fillStyle='#9a7444';ctx.fillRect(24,-2,18,5);ctx.fillRect(57,-3,17,4);
    ctx.restore();
  }
  function drawCrosshair() {
    ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.shadowColor='#000';ctx.shadowBlur=4;
    ctx.beginPath();ctx.arc(mouse.x,mouse.y,10,0,Math.PI*2);ctx.moveTo(mouse.x-17,mouse.y);ctx.lineTo(mouse.x-5,mouse.y);ctx.moveTo(mouse.x+5,mouse.y);ctx.lineTo(mouse.x+17,mouse.y);ctx.moveTo(mouse.x,mouse.y-17);ctx.lineTo(mouse.x,mouse.y-5);ctx.moveTo(mouse.x,mouse.y+5);ctx.lineTo(mouse.x,mouse.y+17);ctx.stroke();ctx.restore();
  }
  function draw() {
    if(!w||!h)return;
    drawFarm();
    drawDuck();
    drawShooter();
    for(const b of bullets){ctx.strokeStyle='#f8e7a0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.025,b.y-b.vy*.025);ctx.stroke();}
    for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ellipse(p.x,p.y,3,3,p.color);ctx.globalAlpha=1;}
    if(running)drawCrosshair();
  }
  function shoot() {
    if(!running)return;
    shots++; shotsEl.textContent=shots;
    const sx=w*.5, sy=h*.88, dx=mouse.x-sx, dy=mouse.y-sy, len=Math.hypot(dx,dy)||1;
    const speed=1500;
    const lucky=Math.random()<chance;
    // Even a lucky shot only counts if it intersects the duck.
    let tx=mouse.x, ty=mouse.y;
    if(lucky){tx=duck.x;ty=duck.y-5;}
    const vx=(tx-sx)/Math.hypot(tx-sx,ty-sy||1)*speed;
    const vy=(ty-sy)/Math.hypot(tx-sx,ty-sy||1)*speed;
    bullets.push({x:sx,y:sy,vx,vy,lucky,life:1.2});
    if(lucky){
      hits++;hitsEl.textContent=hits;
      message.textContent='VOCÊ ACERTOU. O impossível aconteceu.';
      for(let i=0;i<25;i++)particles.push({x:duck.x,y:duck.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.8)*180,life:1,color:'#fff1b0'});
      duck.x=Math.random()*(w*.65)+w*.18;
    } else {
      const lines=['O pato nem piscou.','Você assustou uma cerca.','O disparo passou a quilômetros.','O pato julgou sua mira.','Quase. Mentira, nem perto.','O vento levou sua dignidade.','O pato continua vivendo sua vida.'];
      message.textContent=lines[Math.floor(Math.random()*lines.length)];
    }
  }
  function update(dt) {
    elapsed+=dt; duck.bob+=dt*7; quackTimer+=dt;
    duck.quackBubble=Math.max(0,duck.quackBubble-dt);
    duck.quackNext-=dt;
    if (duck.quackNext<=0) {
      duck.quackBubble=1.25;
      duck.quackNext=4.5+Math.random()*7;
    }
    duck.fear=Math.max(0,duck.fear-dt);
    duck.dodgeCooldown=Math.max(0,duck.dodgeCooldown-dt);
    // O pato aterrissa depois do salto de susto.
    if (duck.jump>0 || duck.jumpV>0) {
      duck.jump += duck.jumpV*dt;
      duck.jumpV -= 1050*dt;
      if (duck.jump<0) { duck.jump=0; duck.jumpV=0; }
    }
    if(duck.pause>0)duck.pause-=dt;
    else {
      duck.x+=duck.dir*duck.speed*dt*60;
      if(duck.x>w*.88){duck.dir=-1;duck.pause=.5;}
      if(duck.x<w*.58){duck.dir=1;duck.pause=.4;}
      if(Math.random()<dt*.12)duck.speed=.35+Math.random()*.9;
    }
    // Detecta tiros que passam perto. O pato entra em pânico e salta para longe.
    bullets.forEach(b => {
      if (b.nearChecked) return;
      const bx=b.x, by=b.y;
      const duckY=duck.y-duck.jump-8;
      const distance=Math.hypot(bx-duck.x, by-duckY);
      if (distance < 58 && duck.dodgeCooldown <= 0 && !b.lucky) {
        b.nearChecked=true;
        duck.fear=1.15;
        duck.jumpV=390;
        duck.dodgeCooldown=1.0;
        const oldX=duck.x;
        const leftSpace=oldX-w*.12, rightSpace=w*.91-oldX;
        let direction = rightSpace>leftSpace ? 1 : -1;
        if (Math.random()<.35) direction*=-1;
        duck.x=Math.max(w*.12,Math.min(w*.91,oldX+direction*(100+Math.random()*100)));
        duck.dir=direction;
        duck.pause=.35;
        message.textContent='O PATO SE ASSUSTOU E SAIU DA LINHA DE TIRO!';
        for(let i=0;i<7;i++) particles.push({x:oldX+(Math.random()-.5)*24,y:duckY-20,vx:(Math.random()-.5)*100,vy:-40-Math.random()*80,life:.45,color:'#fff8dc'});
      }
    });
    bullets=bullets.filter(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;return b.life>0&&b.x>-30&&b.x<w+30&&b.y>-30&&b.y<h+30;});
    particles=particles.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;p.life-=dt;return p.life>0;});
  }
  function loop(t) {
    if(!running)return;
    const dt=Math.min((t-last)/1000||0,.04);last=t;
    update(dt);draw();requestAnimationFrame(loop);
  }
  game.addEventListener('pointermove',e=>{
    const r=canvas.getBoundingClientRect();
    mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
  });
  game.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;
    // No celular, o ponto tocado vira a mira e o toque dispara.
    const r=canvas.getBoundingClientRect();
    mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top;
    if (e.pointerType === 'touch') e.preventDefault();
    shoot();
  });
  window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();shoot();}});
  document.getElementById('play').addEventListener('click',()=>{
    start.style.display='none';running=true;last=performance.now();mouse={x:w*.7,y:h*.55};requestAnimationFrame(loop);
  });
  resize();
})();
</script>
</body>
</html>
